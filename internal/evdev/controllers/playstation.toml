# DualShock 4 (PS4) and DualSense (PS5) over USB or Bluetooth: hid-playstation
# / hid-sony. The PS button is the Guide button. The touchpad and motion
# sensors show up as separate devices without gamepad buttons, and hostd
# does not read them as controllers.
name = "PlayStation controller"
match = { vendor = "054c" }
buttons = { guide = "BTN_MODE", start = "BTN_START", select = "BTN_SELECT" }

# hid-playstation names the buttons by position: cross is BTN_SOUTH, circle
# BTN_EAST, triangle BTN_NORTH (0x133), square BTN_WEST (0x134).
[pad]
family = "playstation"
confirm = "south"
back = "east"

[pad.keys]
BTN_SOUTH = "south"      # cross
BTN_EAST = "east"        # circle
BTN_NORTH = "north"      # triangle
BTN_WEST = "west"        # square
BTN_TL = "lb"            # L1
BTN_TR = "rb"            # R1
BTN_TL2 = "lt"           # L2, as a button as well as an axis
BTN_TR2 = "rt"
BTN_THUMBL = "ls"        # L3
BTN_THUMBR = "rs"
BTN_START = "start"      # Options
BTN_SELECT = "select"    # Share / Create
BTN_MODE = "guide"       # PS
BTN_DPAD_UP = "up"
BTN_DPAD_DOWN = "down"
BTN_DPAD_LEFT = "left"
BTN_DPAD_RIGHT = "right"

[pad.axes]
ABS_X = { as = "lx", min = 0, max = 255 }
ABS_Y = { as = "ly", min = 0, max = 255 }
ABS_RX = { as = "rx", min = 0, max = 255 }
ABS_RY = { as = "ry", min = 0, max = 255 }
ABS_Z = { as = "lt", min = 0, max = 255 }
ABS_RZ = { as = "rt", min = 0, max = 255 }
ABS_HAT0X = { as = "hatx", min = -1, max = 1 }
ABS_HAT0Y = { as = "haty", min = -1, max = 1 }
