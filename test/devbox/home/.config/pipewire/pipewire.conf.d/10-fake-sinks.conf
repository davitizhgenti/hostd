# Two fake outputs, so volume, mute and output switching work without sound
# hardware. Names mirror what the real machine will have.
#
# Null sinks drop volume changes while they are idle and suspended (real sound
# cards keep volume in the hardware mixer, so this only affects fakes), so
# they are kept running; this costs no measurable CPU.
context.objects = [
  { factory = adapter
    args = {
      factory.name            = support.null-audio-sink
      node.name               = "fake-hdmi"
      node.description        = "Fake HDMI (TV)"
      media.class             = Audio/Sink
      audio.position          = [ FL FR ]
      monitor.channel-volumes = true
      priority.session        = 2000
      node.always-process     = true
      session.suspend-timeout-seconds = 0
    }
  }
  { factory = adapter
    args = {
      factory.name            = support.null-audio-sink
      node.name               = "fake-speakers"
      node.description        = "Fake analog speakers"
      media.class             = Audio/Sink
      audio.position          = [ FL FR ]
      monitor.channel-volumes = true
      priority.session        = 1000
      node.always-process     = true
      session.suspend-timeout-seconds = 0
    }
  }
]
