# Managed by hostd's dolphin add-on; changes here are overwritten.
# Dolphin is the launcher of its own group in the menu, Games / Dolphin,
# like Steam: its games (app files that hostd-dolphin-games writes for the
# disc images in ~/Games, each with under = "dolphin-emu") are listed under
# it. A game of your own, in a file of yours in ~/.config/hostd/apps, joins
# the group the same way:
#
#   name = "Mario Kart Wii"
#   under = "dolphin-emu"
#   folder = "Games/Dolphin/Wii"
#   runner = { type = "exec", command = ["flatpak", "run", "org.DolphinEmu.dolphin-emu", "-b", "-e", "/path/to/game.rvz"] }
#   [window]
#   fullscreen = true
extends = "dolphin-emu"
name = "Dolphin"
folder = "Games/Dolphin"
