# share-pc: Linux PCs on core's screen, controlled from core. Moonlight
# (Flatpak) streams the PC's desktop from the Sunshine that runs on the PC.
# One of the four share-* apps (docs/sharing.md). The app for a PC is made by
# `hostd-share-pc add NAME HOST` once the PC is paired, so the menu never lists
# a PC that cannot work; Moonlight's own entry is hidden (it is only the engine).
description = "share-pc: Linux PCs on core's screen, controlled from core (Moonlight, Sunshine on the PC)"
needs = ["flatpak"]
root = false
flatpaks = ["com.moonlight_stream.Moonlight"]
resources = ["apps/moonlight.toml"]
files = [
  { src = "hostd-share-pc", dest = "~/.local/lib/hostd/share-pc/hostd-share-pc", mode = "755", owner = "screen" },
]
rescan = true
keeps = "Moonlight's own data (paired PCs) stays in ~/.var/app/com.moonlight_stream.Moonlight; apps you made with hostd-share-pc add stay (hostd-share-pc remove NAME)"
