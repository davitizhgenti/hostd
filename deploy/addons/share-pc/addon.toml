# share-pc: a Linux PC's screen on core, controlled from core, over the LAN,
# with nothing to install on the PC: GNOME's own Remote Desktop (Settings,
# System, Remote Desktop: Desktop Sharing) serves its screen as RDP, and
# core's small RDP client (freerdp, Wayland) shows it full screen. One of the
# two share-* apps (docs/sharing.md). The app for a PC is made by
# `hostd-share-pc add NAME HOST USER`, so the menu never lists a PC that
# cannot work.
description = "share-pc: a Linux (GNOME) PC's screen on core, controlled from core, over the LAN (RDP, nothing to install on the PC)"
packages = ["freerdp3-wayland"]
files = [
  { src = "hostd-share-pc", dest = "/usr/local/lib/hostd/share-pc/hostd-share-pc", mode = "755" },
]
keeps = "the package (freerdp3-wayland) and the PCs you added in ~/.config/hostd/share-pc (hostd-share-pc remove NAME)"
