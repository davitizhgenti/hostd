# Managed by hostd's steam add-on; changes here are overwritten.
# Steam starts in Big Picture inside gamescope, as on SteamOS: Steam's
# overlay and its Guide button work over games, which run inside it. Its
# desktop window is an action (right click in the menu).
extends = "steam"
name = "Steam"
# Flatpak runs Steam outside hostd's unit; the handoff follows Steam's own
# processes, so closing Steam in hostd ends Steam (and gamescope with it).
runner = { type = "exec", command = ["/usr/local/bin/hostd-steam-session"], handoff = "FLATPAK_ID=com.valvesoftware.Steam" }

# Its window is gamescope's, which runs in hostd's unit for Steam: the unit
# alone finds it, even when gamescope recreates its window without an
# app_id.
[match]
app_id = "gamescope"

[window]
fullscreen = true

[[actions]]
id = "desktop"
name = "Steam (desktop window)"
command = ["flatpak", "run", "com.valvesoftware.Steam"]
