# Managed by hostd's steam add-on; changes here are overwritten.
# Steam in Big Picture, fullscreen: an app like any other. Its games are
# listed under it (their app files say under = "steam"); its actions and
# the games hand Steam a steam:// link.
extends = "steam"
name = "Steam"
# Flatpak runs Steam outside hostd's unit; the handoff follows Steam's own
# processes, so closing Steam in hostd ends Steam, and starting it while
# it runs brings it forward.
runner = { type = "exec", command = ["flatpak", "run", "com.valvesoftware.Steam", "-gamepadui"], handoff = "FLATPAK_ID=com.valvesoftware.Steam" }
# Steam's own desktop actions open its desktop window; these open pages
# in Big Picture instead (Steam is started first if it does not run).
replace_actions = true

[match]
env = "FLATPAK_ID=com.valvesoftware.Steam"

[window]
fullscreen = true

[[actions]]
id = "library"
name = "Library"
command = ["flatpak", "run", "com.valvesoftware.Steam", "steam://open/games"]

[[actions]]
id = "store"
name = "Store"
command = ["flatpak", "run", "com.valvesoftware.Steam", "steam://store"]

[[actions]]
id = "downloads"
name = "Downloads"
command = ["flatpak", "run", "com.valvesoftware.Steam", "steam://open/downloads"]

[[actions]]
id = "settings"
name = "Settings"
command = ["flatpak", "run", "com.valvesoftware.Steam", "steam://open/settings"]
