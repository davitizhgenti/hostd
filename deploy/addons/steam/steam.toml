# Managed by hostd's steam add-on; changes here are overwritten.
# Steam starts in Big Picture, made for a TV and a controller. Its desktop
# window is an action (right click in the menu).
extends = "steam"
name = "Steam"
# Flatpak runs Steam outside hostd's unit; the handoff follows Steam's own
# processes, so closing Steam in hostd ends Steam.
runner = { type = "exec", command = ["flatpak", "run", "com.valvesoftware.Steam", "-gamepadui"], handoff = "FLATPAK_ID=com.valvesoftware.Steam" }

[match]
env = "FLATPAK_ID=com.valvesoftware.Steam"

[window]
fullscreen = true

[[actions]]
id = "desktop"
name = "Steam (desktop window)"
command = ["flatpak", "run", "com.valvesoftware.Steam"]
