# Managed by hostd's pterodactyl add-on; changes here are overwritten.
# The Pterodactyl panel on port 80, plain HTTP: hostd has no certificate
# here (its API is plain HTTP, [api] tls = false).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    include /etc/nginx/snippets/hostd-pterodactyl.conf;
}
