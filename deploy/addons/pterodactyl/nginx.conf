# Managed by hostd's pterodactyl add-on; changes here are overwritten.
# The Pterodactyl panel over HTTPS, with the machine's certificate (from
# hostd's own CA, renewed by hostd; nginx reloads when it changes). Plain
# HTTP redirects to it, except from the machine itself: Wings and the
# screen's browser reach the panel over loopback, which never leaves it.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 127.0.0.1:80;
    listen [::1]:80;
    server_name _;
    include /etc/nginx/snippets/hostd-pterodactyl.conf;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     @TLS_DIR@/cert.pem;
    ssl_certificate_key @TLS_DIR@/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/hostd-pterodactyl.conf;
}
