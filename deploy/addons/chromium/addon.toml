# Chromium (Flatpak), the web browser: an app (its app file adds an
# incognito-window action), and the browser hostd's web-page apps (runner
# url) open in, through a small "chromium" command in ~/.local/bin.
description = "Chromium web browser (also opens hostd's web-page apps)"
needs = ["flatpak"]
root = false
flatpaks = ["org.chromium.Chromium"]
resources = ["apps/chromium.toml"]
files = [
  { src = "chromium", dest = "~/.local/bin/chromium", mode = "755", owner = "screen" },
]
keeps = "Chromium's own data (profile, history) stays in ~/.var/app/org.chromium.Chromium"
