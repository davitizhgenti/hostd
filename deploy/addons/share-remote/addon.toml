# share-remote: Sunshine on core, always on, so a Linux PC or an Android phone
# running Moonlight can show core's screen and control it. One of the four
# share-* apps (docs/sharing.md): it runs as a hostd app (background, started
# with hostd, restarted if it dies; hostctl ps / stop share-remote).
# The package is the one LizardByte publishes for Debian 13 (pinned by version
# and checksum in hook.sh); it captures Sway's screen directly and encodes on
# the GPU. Root installs it once (the package grants it the screen-capture
# permission). Pair a device once with the PIN page of its web UI at
# https://core.local:47990 (the first visit asks for a user name and password).
description = "share-remote: Sunshine on core, always on: show and control core from a Linux PC or an Android phone (Moonlight)"
needs = ["controllers"]
resources = ["apps/share-remote.toml", "apps/sunshine.toml"]
rescan = true
keeps = "Sunshine's settings and paired devices stay in ~/.config/sunshine; the package stays (apt remove sunshine)"
hook = "hook.sh"
