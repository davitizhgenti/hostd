# Managed by hostd's share-phone add-on; changes here are overwritten.
# An Android phone on core's screen, controlled with core's keyboard and mouse
# (scrcpy). Pair it once: docs/sharing.md, or
#   /usr/local/lib/hostd/share-phone/hostd-share-phone help
name = "Share: phone"
runner = { type = "exec", command = ["/usr/local/lib/hostd/share-phone/hostd-share-phone"] }

[window]
fullscreen = true
