# Moonlight (Flatpak): the client of Sunshine. On core it shows another
# computer's screen full-screen (that computer runs Sunshine), with core's
# keyboard, mouse and controllers controlling it. It is listed in the menu
# from its Flatpak entry, like any app.
description = "Moonlight (Flatpak): show a PC running Sunshine on core's screen, controlled from core"
needs = ["flatpak"]
root = false
flatpaks = ["com.moonlight_stream.Moonlight"]
rescan = true
keeps = "Moonlight's own data (paired computers) stays in ~/.var/app/com.moonlight_stream.Moonlight"
