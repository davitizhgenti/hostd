# Sunshine: streams core's screen to Moonlight clients (a PC, a phone, a
# tablet) with core's keyboard, mouse and controllers controlled from there.
# It is the package LizardByte publishes for Debian 13 (pinned by version and
# checksum in hook.sh), which captures Sway's screen directly and encodes on
# the GPU. Root installs it once (its package grants it the screen-capture
# permission); it then runs as the screen user's service. Pair a client with
# the PIN page of its web UI at https://core.local:47990 (the first visit
# asks for a user name and password).
description = "Sunshine: stream core's screen to Moonlight on a PC or phone, and control core from there"
needs = ["controllers"]
resources = ["apps/sunshine.toml"]
rescan = true
keeps = "Sunshine's settings and paired clients stay in ~/.config/sunshine; the package stays (apt remove sunshine)"
hook = "hook.sh"
