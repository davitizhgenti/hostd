# Managed by hostd-setup; changes here are overwritten.
#
# If the screen user's Sway session ends (a crash, a race for the GPU at boot),
# greetd retries the automatic login every few seconds instead of giving up after
# five quick restarts, which left the screen dark until a reboot.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5
