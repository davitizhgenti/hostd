version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
          disabled: true   # doc comments are enforced in review, not on every method
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [unparam, noctx]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/davitizhgenti/hostd
