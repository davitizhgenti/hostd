# The docs site (MkDocs) on GitHub Pages: https://davitizhgenti.github.io/hostd/
# Needs Pages turned on once, with "GitHub Actions" as its source
# (Settings > Pages). Runs when the docs change on main, or by hand.
name: pages

on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          pipx install mkdocs==1.6.1
          mkdocs build --strict -d site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
