name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make lint
      - name: Test
        shell: bash
        run: make test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - run: make build
      - name: Coverage
        shell: bash
        run: make cover 2>&1 | tee cover.log; exit ${PIPESTATUS[0]}
      # Job logs need a GitHub login; an annotation shows on the public run
      # page, so failing tests are visible to anyone.
      - name: Show failing tests
        if: failure()
        shell: bash
        run: |
          msg=$(grep -h -B3 -A25 -E -- '--- FAIL|^panic:|FAIL: testdata' test.log cover.log 2>/dev/null | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Failing tests::${msg:-no test failure found in the output}"

  # Shell scripts, the Python menu and the OpenAPI description: what make
  # lint does not see. (The description's freshness is a Go test.)
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tools
        run: |
          sudo apt-get install -y -q shellcheck >/dev/null
          pipx install ruff
      - run: make lint-scripts
      - name: OpenAPI
        run: npx --yes @redocly/cli@1.34.5 lint docs/openapi.json
      - name: Docs
        run: |
          pipx install mkdocs==1.6.1
          mkdocs build --strict -d "$RUNNER_TEMP/site"

  # After the tests pass on main, publish the binaries as the rolling
  # "edge" pre-release. deploy/install.sh downloads them from there and
  # checks them against SHA256SUMS.
  # A push to main publishes the rolling "edge" pre-release; a tag v*
  # publishes that release (the "stable" update channel takes the latest
  # one; a tag with a suffix, v0.2.0-rc1, is a pre-release).
  edge:
    needs: [test, scripts]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # The signing key lives in this environment, which only main and v*
    # tags may use (Settings > Environments > release: deployment branches
    # and tags). A workflow run from anywhere else cannot sign a build.
    environment: release
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=$GITHUB_REF_NAME; else version=edge-${GITHUB_SHA::7}; fi
          pipx install mkdocs==1.6.1
          make release VERSION="$version"
      # SHA256SUMS lists every file; its signature is what the installer
      # checks (with the key in deploy/release-key.pem, also in install.sh).
      - name: Sign
        env:
          HOSTD_SIGNING_KEY: ${{ secrets.HOSTD_SIGNING_KEY }}
        run: |
          if [ -z "$HOSTD_SIGNING_KEY" ]; then
            echo "::error title=No signing key::the HOSTD_SIGNING_KEY secret is not set; machines refuse unsigned builds"
            exit 1
          fi
          grep -qF "$(sed -n 2p deploy/release-key.pem)" deploy/install.sh ||
            { echo "::error::deploy/install.sh does not carry the key in deploy/release-key.pem"; exit 1; }
          key="$RUNNER_TEMP/key.pem"
          (umask 077; printf '%s\n' "$HOSTD_SIGNING_KEY" > "$key")
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
          rm -f "$key"
          openssl pkeyutl -verify -pubin -inkey deploy/release-key.pem -rawin -in dist/SHA256SUMS -sigfile dist/SHA256SUMS.sig
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* $pre --verify-tag --title "hostd $GITHUB_REF_NAME" --generate-notes
      - name: Publish the edge release
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete edge --yes --cleanup-tag || true
          gh release create edge dist/* --prerelease --target "$GITHUB_SHA" \
            --title "edge: latest main" \
            --notes "Built from $GITHUB_SHA after the tests passed. deploy/install.sh installs this build."

# Also: .github/workflows/install.yml (the installer in a Debian container)
# and nightly fuzzing. Still to come (plan.md §2): integration tests on
# pull requests, and the e2e VM.
