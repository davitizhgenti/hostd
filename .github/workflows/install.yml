name: install

# The installer's whole lifecycle (install, run again, update with
# rollback, uninstall, reinstall) in a fresh Debian 13 container with
# systemd: make test-install. It runs when the installer or its tests
# change, every night, and on demand.
on:
  push:
    paths:
      - "deploy/**"
      - "test/install/**"
      - "Makefile"
      - ".github/workflows/install.yml"
  pull_request:
    paths:
      - "deploy/**"
      - "test/install/**"
      - "Makefile"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install test
        shell: bash
        run: make test-install 2>&1 | tee install.log; exit ${PIPESTATUS[0]}
      - name: Show failed checks
        if: failure()
        shell: bash
        run: |
          msg=$(grep -h -E "FAIL|error" install.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Install test failed::${msg:-see the job log}"

  # Fuzz targets, a few minutes each, on the same schedule.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=3m
